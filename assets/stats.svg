<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="GitHub analytics: 19 repositories, 13 stars earned, 6 followers, 190 contributions, language distribution led by TypeScript, Python and JavaScript">
  <title>GitHub Analytics</title>
  <desc>Self-hosted snapshot of GitHub profile statistics and language distribution.</desc>

  <defs>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab8ff"/>
      <stop offset="0.45" stop-color="#5d8bff"/>
      <stop offset="1" stop-color="#ab86ff"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9d6bff" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#17396b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#17396b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.88" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3b2a6b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b2a6b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#aebad1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="#0b0e14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glowBlue)"/>
  <rect width="1200" height="300" fill="url(#glowViolet)"/>

  <!-- Inset frame -->
  <rect x="16" y="16" width="1168" height="268" rx="18" fill="none" stroke="url(#frameGrad)" stroke-width="1.5"/>

  <!-- Stat clusters -->
  <g text-anchor="start">
    <text x="80" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#numGrad)">19</text>
    <text x="80" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8fa1c0">REPOSITORIES</text>

    <text x="350" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#numGrad)">13</text>
    <text x="350" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8fa1c0">STARS EARNED</text>

    <text x="620" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#numGrad)">6</text>
    <text x="620" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8fa1c0">FOLLOWERS</text>

    <text x="890" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#numGrad)">190</text>
    <text x="890" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8fa1c0">CONTRIBUTIONS · ALL TIME</text>
  </g>

  <!-- Cluster separators -->
  <g stroke="#aebad1" stroke-opacity="0.08" stroke-width="1">
    <line x1="315" y1="66" x2="315" y2="152"/>
    <line x1="585" y1="66" x2="585" y2="152"/>
    <line x1="855" y1="66" x2="855" y2="152"/>
  </g>

  <!-- Language distribution -->
  <text x="80" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8fa1c0">LANGUAGE DISTRIBUTION</text>

  <g>
    <rect x="80" y="210" width="460.1" height="16" rx="8" fill="#3178C6"/>
    <rect x="542.1" y="210" width="280.2" height="16" rx="8" fill="#3572A5"/>
    <rect x="824.3" y="210" width="255.4" height="16" rx="8" fill="#F1E05A"/>
    <rect x="1081.7" y="210" width="38.3" height="16" rx="8" fill="#8B949E"/>
  </g>

  <!-- Legend -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c9d1d9">
    <circle cx="84" cy="249" r="4.5" fill="#3178C6"/>
    <text x="96" y="254">TypeScript 44.5%</text>

    <circle cx="320" cy="249" r="4.5" fill="#3572A5"/>
    <text x="332" y="254">Python 27.1%</text>

    <circle cx="530" cy="249" r="4.5" fill="#F1E05A"/>
    <text x="542" y="254">JavaScript 24.7%</text>

    <circle cx="740" cy="249" r="4.5" fill="#8B949E"/>
    <text x="752" y="254">Other 3.7%</text>
  </g>

  <text x="1120" y="254" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#7e889d">GitHub data · November 2026</text>
</svg>
